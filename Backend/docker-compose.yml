services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: flight_postgis
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  c4ientities:
    build:
      context: .
      dockerfile: C4IEntities/Dockerfile
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgis;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    ports:
      - "5293:8080"
    depends_on:
      - postgis

  bff.service:
    build:
      context: .
      dockerfile: Bff.Service/Dockerfile
    environment:
      - AiAgentsUrl=http://ai-agents:8080
      - C4IServiceUrl=http://c4ientities:8080
      - GoogleApiKey=${GOOGLE_API_KEY}
      - OllamaUrl=${OLLAMA_URL:-http://host.docker.internal:11434}
    ports:
      - "5135:8080"
    depends_on:
      - c4ientities
      - ai-agents

  ai-agents:
    build:
      context: .
      dockerfile: AiAgents/Dockerfile
    environment:
      - OllamaOpenAiEndpoint=${OLLAMA_URL:-http://host.docker.internal:11434}/v1
      - OllamaModel=${OLLAMA_MODEL:-llama3.2}
      - C4IServiceUrl=http://c4ientities:8080
      - BffServiceUrl=http://bff.service:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"

  flight_aspire_dashboard:
    image: mcr.microsoft.com/dotnet/nightly/aspire-dashboard:latest
    container_name: flight_aspire_dashboard
    ports:
      - "18888:18888"
      - "4317:4317"
      - "4318:4318"
    environment:
      - ASPIRE_ALLOW_UNAUTHENTICATED_ACCESS=true

volumes:
  postgres_data:
