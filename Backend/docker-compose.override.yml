services:
  postgis:
    # Host port 5433 to avoid conflict with other local Postgres instances;
    # internal services still connect via the Docker network on 5432.
    ports: !override
      - "5433:5432"

  bff.service:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - AllowedOrigins__0=http://localhost:5173
      - AllowedOrigins__1=http://localhost:4173
      - AllowedOrigins__2=http://localhost:5174
    ports:
      - "5135:8080"

  c4ientities:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
    ports:
      - "5293:8080"

  ai-agents:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
